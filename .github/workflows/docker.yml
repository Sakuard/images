name: Build Docker Images

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "*/Dockerfile"
      - "*/version"

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - id: detect
        shell: bash
        run: |
          DIRS=$(git diff --name-only HEAD^ HEAD \
            | grep -E '^[^/]+/(Dockerfile|version)$' \
            | cut -d/ -f1 \
            | sort -u)

          MATRIX=$(printf '%s\n' "$DIRS" \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: changes

    if: needs.changes.outputs.matrix != '[]'

    strategy:
      matrix:
        image: ${{ fromJson(needs.changes.outputs.matrix) }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: |
          VERSION=$(cat "${{ matrix.image }}/version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}